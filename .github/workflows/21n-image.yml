# 21n fork only (not for upstream): build the image Railway runs.
name: 21n image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: 21n-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/21nco/mira:21n
            ghcr.io/21nco/mira:sha-${{ github.sha }}
